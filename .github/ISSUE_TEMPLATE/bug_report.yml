name: Bug report
description: Report reproducible behaviour that does not match the docs or UI.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        Do **not** report security vulnerabilities here — see SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including the screen you were on.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a folder in Settings
        2. Open Songs and play a track
        3. Edit its metadata
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version / commit
      description: The version in Settings → About, or the commit you built.
      placeholder: "0.1"
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: "Android 16, Pixel 8 emulator"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Where did you get the build?
      options:
        - GitHub release
        - Built from source
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or recordings
      description: Optional, but very helpful. Remove any personal data first.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md).
          required: true
